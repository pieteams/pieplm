name: Bug Report
description: Report a bug or unexpected behavior
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible.

  - type: input
    id: page
    attributes:
      label: Page URL
      description: Link to the page where the problem appears
      placeholder: https://pieteams.github.io/pieplm/...
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What is wrong?
      description: What did you see, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open the page above
        2. ...

  - type: textarea
    id: context
    attributes:
      label: Screenshots or Console Output
      description: Drag screenshots here, or paste any relevant console output
